<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No internet — Ghar Kharcha Manager</title>
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f5132;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 340px; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.85; }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        background: #ffffff;
        color: #0f5132;
        font-size: 15px;
        font-weight: 600;
      }
      .status { margin-top: 14px; font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Ghar Kharcha Manager" width="88" height="88" />
      <h1>No internet connection</h1>
      <p>
        इंटरनेट कनेक्शन नहीं है. Please check your mobile data or Wi-Fi — Ghar Kharcha Manager will
        reload automatically as soon as you are back online.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <div class="status" id="status">Waiting for connection…</div>
    </div>
    <script>
      var status = document.getElementById("status");
      function reload() {
        status.textContent = "Back online — reloading…";
        window.location.replace("https://ghar-kharcha-guardian.lovable.app/");
      }
      window.addEventListener("online", reload);
      setInterval(function () {
        if (navigator.onLine) reload();
      }, 3000);
    </script>
  </body>
</html>
