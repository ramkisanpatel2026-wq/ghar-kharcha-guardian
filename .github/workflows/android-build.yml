name: Android Build (APK)

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build an unsigned release APK"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_ID: com.gharkharcha.app
  APP_NAME: Ghar Kharcha
  VERSION_NAME: 1.0.0
  VERSION_CODE: 1

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21

        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply app version and SDK levels
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"${VERSION_NAME}\"/" "$GRADLE"
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID}\"/" "$GRADLE"
          echo "--- build.gradle defaultConfig ---"
          sed -n '1,60p' "$GRADLE"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ghar-Kharcha-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghar-Kharcha-debug-apk
          path: Ghar-Kharcha-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Optional release build ----
      # Unsigned unless a keystore is provided via repository secrets:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode signing keystore (optional)
        id: keystore
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found — building an UNSIGNED release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        working-directory: android
        env:
          KEYSTORE_PATH: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        if: ${{ github.event_name == 'push' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: Ghar-Kharcha-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
