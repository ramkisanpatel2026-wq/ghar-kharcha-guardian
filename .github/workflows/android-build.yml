name: Android Build (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_ID: com.gharkharcha.app
  APP_NAME: Ghar Kharcha
  VERSION_NAME: 1.0.1
  VERSION_CODE: 2

jobs:
  build:
    name: Build Debug + Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply app id and version
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID}\"/" "$GRADLE"
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"${VERSION_NAME}\"/" "$GRADLE"
          sed -n '1,60p' "$GRADLE"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---------- Debug APK ----------
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect debug APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Ghar-Kharcha-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghar-Kharcha-debug-apk
          path: artifacts/Ghar-Kharcha-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- Release APK (always signed) ----------
      # Uses your upload keystore when these repository secrets exist:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Otherwise a temporary keystore is generated so the release APK is still
      # installable (fine for testing, NOT for Google Play updates).
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS_PATH="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
            echo "store_pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found — generating a temporary keystore. Installable, but cannot be used for Play Store updates."
            keytool -genkeypair -v -keystore "$KS_PATH" -alias gharkharcha \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass gharkharcha -keypass gharkharcha \
              -dname "CN=Ghar Kharcha, OU=Mobile, O=Ghar Kharcha, L=Pune, S=MH, C=IN"
            echo "store_pass=gharkharcha" >> "$GITHUB_OUTPUT"
            echo "key_pass=gharkharcha" >> "$GITHUB_OUTPUT"
            echo "alias=gharkharcha" >> "$GITHUB_OUTPUT"
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi
          echo "keystore=$KS_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          GK_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          GK_STORE_PASSWORD: ${{ steps.signing.outputs.store_pass }}
          GK_KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          GK_KEY_PASSWORD: ${{ steps.signing.outputs.key_pass }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GK_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$GK_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$GK_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$GK_KEY_PASSWORD"

      - name: Collect and verify release APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No signed release APK produced"; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/Ghar-Kharcha-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs artifacts/Ghar-Kharcha-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghar-Kharcha-release-apk
          path: artifacts/Ghar-Kharcha-release.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- Play Store bundle (optional but produced anyway) ----------
      - name: Build release AAB (for Google Play)
        working-directory: android
        continue-on-error: true
        env:
          GK_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          GK_STORE_PASSWORD: ${{ steps.signing.outputs.store_pass }}
          GK_KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          GK_KEY_PASSWORD: ${{ steps.signing.outputs.key_pass }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GK_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$GK_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$GK_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$GK_KEY_PASSWORD"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghar-Kharcha-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      # ---------- Publish a downloadable GitHub Release ----------
      - name: Publish release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: Ghar Kharcha ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: |
            Ghar Kharcha Android build.

            - Version: ${{ env.VERSION_NAME }} (code ${{ env.VERSION_CODE }})
            - Package: ${{ env.APP_ID }}
            - Commit: ${{ github.sha }}
          files: |
            artifacts/Ghar-Kharcha-release.apk
            artifacts/Ghar-Kharcha-debug.apk
